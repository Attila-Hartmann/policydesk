[project]
name = "policydesk"
version = "0.1.0"
description = "Question answering over internal policy documents (RAG backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "uvicorn>=0.54",
  "pydantic-settings>=2.16",
  "openai>=3.49",
  "langgraph>=1.2",
  "numpy>=2.5",
]

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "ruff>=0.17",
  "mypy>=2.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # typographic characters (›, –) are intended

[tool.mypy]
packages = ["policydesk"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration' --strict-markers"
markers = ["integration: needs a running Ollama and/or OPENAI_API_KEY (run with: uv run pytest -m integration)"]

[tool.coverage.run]
source = ["policydesk"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
